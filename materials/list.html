<body class="materials-page" data-page="materials_list">
  <div class="materials-shell materials-shell--list">
    <div data-materials-list-classic>
      <header class="materials-list-head">
        <nav class="mat-list-top-back" aria-label="サイトナビゲーション">
          <a class="mat-list-top-back__link" href="/materials/"><span class="mat-list-top-back__arrow" aria-hidden="true">←</span> TOPへ戻る</a>
        </nav>
        <h1 class="materials-list-head__title">素材一覧</h1>
        <form class="materials-all-search" data-materials-all-search role="search">
          <div class="materials-all-search__field">
            <input type="search" name="q" value="" placeholder="キーワードで検索" aria-label="キーワードで検索" data-materials-all-q>
          </div>
          <button type="submit" class="materials-all-search__btn">検索</button>
          <label class="materials-all-sort">
            <span class="visually-hidden">並び順</span>
            <select data-materials-all-sort aria-label="並び順">
              <option value="popular">人気順</option>
              <option value="newest">新着順</option>
            </select>
          </label>
        </form>
        <nav class="materials-list-chips mat-list-m-chips" data-materials-list-chips aria-label="カテゴリ">
          <button type="button" class="materials-list-chip is-active" data-materials-list-chip data-category="" aria-current="true">すべて</button>
          <button type="button" class="materials-list-chip" data-materials-list-chip data-category="template">テンプレート</button>
          <button type="button" class="materials-list-chip" data-materials-list-chip data-category="bgm">BGM</button>
          <button type="button" class="materials-list-chip" data-materials-list-chip data-category="sfx">効果音 / SFX</button>
          <button type="button" class="materials-list-chip" data-materials-list-chip data-category="image">画像素材</button>
          <button type="button" class="materials-list-chip" data-materials-list-chip data-category="illustration">イラスト</button>
          <button type="button" class="materials-list-chip" data-materials-list-chip data-category="background">背景素材</button>
          <button type="button" class="materials-list-chip" data-materials-list-chip data-category="icon">アイコン</button>
          <button type="button" class="materials-list-chip" data-materials-list-chip data-category="web">Web素材</button>
          <button type="button" class="materials-list-chip" data-materials-list-chip data-category="code">コード</button>
          <button type="button" class="materials-list-chip" data-materials-list-chip data-category="text">文例・文章テンプレート</button>
          <button type="button" class="materials-list-chip" data-materials-list-chip data-category="tool">ツール</button>
          <button type="button" class="materials-list-chip" data-materials-list-chip data-category="presentation">プレゼン</button>
        </nav>
        <div class="materials-all-filters mat-list-m-filters" data-materials-all-filters>
          <select class="materials-all-filter" data-materials-all-filter="usage" aria-label="用途" disabled>
            <option value="">用途</option>
          </select>
          <select class="materials-all-filter" data-materials-all-filter="format" aria-label="形式" disabled>
            <option value="">形式</option>
          </select>
          <select class="materials-all-filter" data-materials-all-filter="style" aria-label="スタイル" disabled>
            <option value="">スタイル</option>
          </select>
          <select class="materials-all-filter" data-materials-all-filter="color" aria-label="カラー" disabled>
            <option value="">カラー</option>
          </select>
          <button type="button" class="materials-all-clear" data-materials-all-clear>すべてクリア</button>
          <span class="materials-all-result-count" data-materials-all-count>検索結果：<strong>0</strong>件</span>
        </div>
      </header>
      <div data-materials-list-grid aria-live="polite"></div>
      <nav class="materials-all-pager" data-materials-all-pager aria-label="ページネーション" hidden></nav>
    </div>
    <div data-materials-list-sfx hidden aria-live="polite"></div>
    <div data-materials-list-bgm hidden aria-live="polite"></div>
    <div data-materials-list-image hidden aria-live="polite"></div>
    <div data-materials-list-illustration hidden aria-live="polite"></div>
    <div data-materials-list-background hidden aria-live="polite"></div>
    <div data-materials-list-icon hidden aria-live="polite"></div>
    <div data-materials-list-web hidden aria-live="polite"></div>
    <div data-materials-list-code hidden aria-live="polite"></div>
    <div data-materials-list-document hidden aria-live="polite"></div>
    <div data-materials-list-presentation hidden aria-live="polite"></div>
    <div data-materials-list-template hidden aria-live="polite"></div>
  </div>

  <footer class="site-footer" id="footer">
    <div class="footer-inner">
      <div class="footer-grid">

        </div>
      </div>
      <div class="footer-bottom">
        <span>© Materials. All rights reserved.</span>

          <span class="language-button">日本語</span>
