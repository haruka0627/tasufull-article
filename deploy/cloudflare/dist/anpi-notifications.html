<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>安否確認履歴 | TASFUL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="anpi-notifications.css">
  <link rel="stylesheet" href="tasful-app-mobile.css">
  <link rel="stylesheet" href="tasful-app-mobile-detail.css">
  <link rel="stylesheet" href="tasful-mobile-detail-template.css">
</head>
<body class="dash-body anpi-notifications-page" data-page="anpi-notifications">
  <div class="dash-app">
    <div class="dash-sidebar__overlay" data-dash-overlay aria-hidden="true"></div>
    <aside class="dash-sidebar" id="dashSidebar" aria-label="会員メニュー">
      <div class="dash-sidebar__brand">
        <a href="index-top.html" class="tasful-ai-logo dash-sidebar__logo" aria-label="TASFUL">
          <img src="images/tasful-ai-globe.png?v=4" alt="" class="tasful-ai-logo-icon">
          <div class="tasful-ai-logo-text"><span class="main">TASFUL</span></div>
        </a>
      </div>
      <nav class="dash-sidebar__nav" id="dashSidebarNav" aria-label="サイドナビ">
        <div class="dash-nav-group">
          <p class="dash-nav-group__label">安否</p>
          <a class="dash-nav-link" href="anpi-dashboard.html">安否ダッシュボード</a>
          <a class="dash-nav-link" href="anpi-register.html">安否サービス設定</a>
          <a class="dash-nav-link is-active" href="anpi-notifications.html">安否確認履歴</a>
          <a class="dash-nav-link" href="dashboard.html">ダッシュボード</a>
        </div>
      </nav>
    </aside>

    <div class="dash-main">
      <header class="dash-header dash-header--account">
        <div class="dash-shell dash-header__inner">
          <div class="dash-header__left">
            <button type="button" class="dash-menu-btn" data-dash-menu aria-label="メニューを開く">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <a href="index-top.html" class="tasful-ai-logo dash-header__logo" aria-label="TASFUL">
              <img src="images/tasful-ai-globe.png?v=4" alt="" class="tasful-ai-logo-icon">
              <div class="tasful-ai-logo-text"><span class="main">TASFUL</span></div>
            </a>
          </div>
          <div class="dash-header__actions">
            <a href="anpi-dashboard.html" class="dash-header-link" aria-label="安否ダッシュボード">
              <span class="dash-header-link__label">ダッシュボード</span>
            </a>
            <span class="dash-header__sep" aria-hidden="true"></span>
            <a href="anpi-register.html" class="dash-header-link" aria-label="安否設定">
              <span class="dash-header-link__label">設定</span>
            </a>
            <span class="dash-header__sep" aria-hidden="true"></span>
            <a href="profile-settings.html" class="dash-profile" aria-label="プロフィール">
              <img class="dash-profile__avatar" data-dash-avatar src="https://placehold.co/64x64/f3ead4/967622?text=ME" width="40" height="40" alt="">
              <span class="dash-profile__text">
                <span class="dash-profile__name" data-dash-user-name>会員</span>
                <span class="dash-profile__sub">個人・事業者</span>
              </span>
            </a>
          </div>
        </div>
      </header>

      <main class="dash-content dash-shell anpi-notifications-main" data-anpi-notifications-root>
        <section class="dash-member-page-head">
          <h1 class="dash-member-page-head__title">安否確認履歴</h1>
          <p class="dash-member-page-head__sub">本日の安否確認状態と、これまでの確認履歴を表示します。</p>
        </section>

        <div class="anpi-notif-auth" data-anpi-auth-gate hidden role="status">
          <p>履歴を表示するにはログインが必要です。</p>
          <a class="anpi-notif-auth__cta" href="login.html">ログインへ</a>
        </div>

        <p class="anpi-notif-status" data-anpi-page-status aria-live="polite"></p>
        <div class="anpi-notif-errors" data-anpi-page-errors hidden role="alert"></div>

        <p class="anpi-notif-env-note" data-anpi-env-note>
          現在はテスト環境のため、外部への通知は送信されません。
        </p>

        <section class="anpi-today-card anpi-panel-card" data-anpi-today-card hidden aria-labelledby="anpiNotifTodayTitle">
          <div class="anpi-today-card__head">
            <h2 id="anpiNotifTodayTitle" class="anpi-today-card__title">本日の状態</h2>
            <span class="anpi-today-card__badge" data-anpi-today-badge>—</span>
          </div>
          <p class="anpi-today-card__meta" data-anpi-today-meta></p>
          <div class="anpi-today-card__links">
            <a href="anpi-dashboard.html">ダッシュボードで確認する</a>
            <a href="anpi-register.html">設定・連絡先を管理</a>
          </div>
        </section>

        <section class="anpi-notifications-list-section" aria-labelledby="anpiListTitle" data-anpi-history-section hidden>
          <div class="anpi-notifications-list-head">
            <h2 id="anpiListTitle" class="anpi-notifications-list-title">確認履歴</h2>
            <button type="button" class="anpi-notifications-refresh" data-anpi-refresh>更新</button>
          </div>
          <p class="anpi-notif-loading" data-anpi-loading hidden>読み込み中…</p>
          <div class="anpi-notifications-empty" data-anpi-empty hidden>
            <p class="anpi-notifications-empty__title">履歴はまだありません</p>
            <p class="anpi-notifications-empty__hint">安否確認が始まると、ここに表示されます。</p>
          </div>
          <ul class="anpi-history-list" data-anpi-history-list aria-live="polite"></ul>
        </section>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="chat-supabase-config.js" defer></script>
  <script src="supabase-public-key.js" defer></script>
  <script src="tasu-supabase-client.js" defer></script>
  <script src="anpi-identity.js" defer></script>
  <script src="auth-current-user.js" defer></script>
  <script src="platform-actor-resolver.js" defer></script>
  <script src="anpi-rpc-client.js" defer></script>
  <script src="anpi-notifications.js" defer></script>
  <script src="tasful-app-mobile.js" defer></script>
  <script src="tasful-mobile-detail-template.js" defer></script>
</body>
</html>
