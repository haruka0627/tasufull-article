# ANPI Phase 56 — Staging scheduler Worker (Cloudflare Cron Triggers)
#
# Staging ONLY. Do not deploy to production routes or production Supabase.
#
# Secrets (wrangler secret put — never commit values):
#   ANPI_STAGING_SUPABASE_URL
#   ANPI_STAGING_SUPABASE_SERVICE_ROLE_KEY
#   ANPI_DIAGNOSTIC_TOKEN
#
# Deploy:
#   cd deploy/cloudflare/workers/anpi-staging-scheduler
#   npx wrangler deploy
#
# Rollback:
#   npx wrangler deployments list
#   npx wrangler rollback <version-id>
#   # or: remove triggers.crons / set ANPI_STAGING_RUNTIME_ENABLED=false

name = "anpi-staging-scheduler"
main = "src/index.mjs"
compatibility_date = "2026-07-02"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# Keep preview URLs off — diagnostic endpoint is token-gated; avoid extra public surfaces.
preview_urls = false

[triggers]
# UTC. Minutes: 00,05,10,15,20,25,30,35,40,45,50,55
crons = ["*/5 * * * *"]

[vars]
ANPI_ENVIRONMENT = "staging"
ANPI_STAGING_PROJECT_REF = "ahlxuyvhzqdqaojiywmu"
ANPI_STAGING_RUNTIME_ENABLED = "true"
ANPI_NOTIFICATION_PROVIDER = "talk_local"
ANPI_CRON_EXPRESSION = "*/5 * * * *"
# Phase 62 scoped Cron soak — keep FALSE outside approved soak windows.
# When true: claim via anpi_phase62_claim_jobs_allowlisted + Phase 61 writer.
# Does not flip provider to talk_write. Does not alter anpi_phase6_claim_jobs.
ANPI_P62_SCOPED_CRON_PATH = "false"
ANPI_P61_SCOPED_WRITER_ENABLED = "false"

# Optional: version metadata for lease holder identity
[version_metadata]
binding = "CF_VERSION_METADATA"
