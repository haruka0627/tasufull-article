# SSOT Staging Worker — deploy/cloudflare/workers/tlv-cf-llhls-ingest/
# Staging-only deploy. Do not deploy wrangler.production.toml from this PR.
# Do not wrangler containers delete / Dashboard Delete Container.
#
# Keep the already-published Staging container image. Do not invent a new
# Dockerfile here.

name = "tlv-cf-llhls-ingest-staging"
main = "worker.js"
compatibility_date = "2026-06-01"

[vars]
TLV_CF_LLHLS_ENV = "staging"
TLV_CF_LLHLS_ADMIN_STOP_GO = "0"

[[containers]]
class_name = "TlvCfLlhlsIngestContainer"
instance_type = "standard-3"
max_instances = 8

[[durable_objects.bindings]]
name = "TLV_CF_LLHLS_INGEST"
class_name = "TlvCfLlhlsIngestContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TlvCfLlhlsIngestContainer"]
