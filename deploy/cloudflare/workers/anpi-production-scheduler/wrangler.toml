crons = ["*/5 * * * *"]

[vars]
ANPI_ENVIRONMENT = "production"
ANPI_PRODUCTION_PROJECT_REF = "ddojquacsyqesrjhcvmn"
# Hard refuse staging ref in application code (to be enforced by Production adapter)
ANPI_PRODUCTION_RUNTIME_ENABLED = "false"
ANPI_NOTIFICATION_PROVIDER = "talk_local"
ANPI_CRON_EXPRESSION = "*/5 * * * *"
ANPI_P62_SCOPED_CRON_PATH = "false"
ANPI_P61_SCOPED_WRITER_ENABLED = "false"
# Critical: disable legacy Phase 47 claim so flag-off cannot mutate pending jobs
ANPI_ALLOW_LEGACY_CLAIM = "false"

[version_metadata]
binding = "CF_VERSION_METADATA"
