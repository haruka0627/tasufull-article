# TASFUL TALK coturn STAGING example — contains no secret or private key.
# Replace all *.example.invalid values through the host secret/config system.

listening-port=3478
tls-listening-port=5349
alt-tls-listening-port=443
listening-ip=0.0.0.0
relay-ip=REPLACE_WITH_PRIVATE_OR_PUBLIC_RELAY_IP
external-ip=REPLACE_WITH_PUBLIC_IP/REPLACE_WITH_RELAY_IP

min-port=49160
max-port=49260

fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=INJECT_AT_RUNTIME_DO_NOT_COMMIT
realm=turn.staging.tasful.example.invalid
stale-nonce=600

no-loopback-peers
no-multicast-peers
response-origin-only-with-rfc5780

# Prevent allocations to internal/private/link-local/multicast destinations.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

user-quota=4
total-quota=200
bps-capacity=0

cert=/run/secrets/talk_turn_fullchain.pem
pkey=/run/secrets/talk_turn_privkey.pem
no-tlsv1
no-tlsv1_1
cipher-list=HIGH:!aNULL:!MD5:!3DES

no-cli
no-software-attribute
log-file=stdout
simple-log

# Metrics are private-network only; never expose this port publicly.
prometheus
prometheus-port=9641
